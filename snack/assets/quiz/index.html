<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snack</title>
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --text:#1f1d1a; --text-2:#5c5850; --muted:#8a857b;
  --border:rgba(31,29,26,.12); --border-strong:rgba(31,29,26,.26);
  --accent:#5a4fd0; --accent-hover:#463cb3; --on-accent:#ffffff; --accent-bg:#ecebfc; --accent-text:#3c3489;
  --ok:#2c7a3c; --ok-bg:#e5f2e1; --ok-border:#93c993;
  --no:#b3362f; --no-bg:#fbe8e6; --no-border:#eba59e;
  --hl:#ef8a00;
  --code-bg:#1e1d23; --code-text:#ece9f5; --code-dim:#8f8a9e;
  --mock-bg:#fbfaf7; --mock-line:#e1ddd4; --mock-dark:rgba(20,18,30,.46);
  --t-gui:#7c6fe0; --t-terminal:#3f8f6b; --t-git:#e0703a; --t-web:#3b82d6; --t-fehler:#d6455d;
  --t-sicherheit:#c99512; --t-prompten:#1f9e9a; --t-sessions:#d05aa0;
  --t-claude:#a0623a; --t-code:#6f8f1f; --t-dateien:#5f7182; --t-projekte:#9a4fc0;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161519; --surface:#211f25; --surface-2:#2a282f; --text:#eeebe4; --text-2:#b3aea5; --muted:#857f76;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.24);
    --accent:#9b92f2; --accent-hover:#b3acf7; --on-accent:#16123a; --accent-bg:#2c2852; --accent-text:#d0cbfb;
    --ok:#8ad197; --ok-bg:#1c3221; --ok-border:#3e6d46;
    --no:#f39a91; --no-bg:#3a1f1f; --no-border:#7c3b36;
    --hl:#ffb347;
    --code-bg:#0f0e12; --mock-bg:#1b1a1f; --mock-line:#3a373f; --mock-dark:rgba(0,0,0,.58);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161519; --surface:#211f25; --surface-2:#2a282f; --text:#eeebe4; --text-2:#b3aea5; --muted:#857f76;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.24);
  --accent:#9b92f2; --accent-hover:#b3acf7; --on-accent:#16123a; --accent-bg:#2c2852; --accent-text:#d0cbfb;
  --ok:#8ad197; --ok-bg:#1c3221; --ok-border:#3e6d46;
  --no:#f39a91; --no-bg:#3a1f1f; --no-border:#7c3b36;
  --hl:#ffb347;
  --code-bg:#0f0e12; --mock-bg:#1b1a1f; --mock-line:#3a373f; --mock-dark:rgba(0,0,0,.58);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans",Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:24px 16px 72px}
h1,h2,h3{line-height:1.25;margin:0}
p{margin:0}
code,kbd,.code{font-family:ui-monospace,"JetBrains Mono","Fira Code","Cascadia Code",Menlo,monospace}
code{font-size:.88em;background:var(--surface-2);padding:1px 6px;border-radius:5px}
kbd{font-size:12px;padding:1px 6px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{border-color:var(--text-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.btn.big{padding:14px 26px;font-size:18px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:6px 12px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.banner{padding:10px 14px;border-radius:var(--radius);background:var(--no-bg);color:var(--no);border:1px solid var(--no-border);font-size:14px;margin-bottom:14px}

/* Start */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:17px}
.hero{padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero h1{font-size:24px;margin-bottom:4px}
.hero p{color:var(--text-2);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 30px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stat .num{font-size:24px;font-weight:700;line-height:1.2}
.stat .num span{font-size:15px;font-weight:500;color:var(--text-2)}
.stat .lbl{font-size:13px;color:var(--text-2)}
.section-title{font-size:15px;font-weight:600;color:var(--text-2);margin:0 0 10px}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:auto minmax(0,1fr) 110px auto;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .1s}
.topic:hover{border-color:var(--c)}
.topic:active{transform:scale(.99)}
.topic[disabled]{opacity:.55;cursor:default}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.t-main{display:flex;flex-direction:column;min-width:0}
.t-name{font-weight:600;font-size:16px}
.t-sub{font-size:13px;color:var(--text-2)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar i.seen{background:var(--c);opacity:.3}
.bar i.learned{background:var(--c)}
.chev{color:var(--muted);font-size:20px}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:30px;font-size:13px;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.linkish:hover{color:var(--no)}

/* Runde */
.round-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.progress{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}
.count{font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:4px 11px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.tag.soft{background:var(--accent-bg);color:var(--accent-text)}
.frage{font-size:22px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
.code-wrap{margin:14px 0 4px}
.code-lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.code{display:block;background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.code .sign{color:var(--code-dim);user-select:none;margin-right:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .key{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--text-2);margin-top:1px}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok-border);background:var(--ok-bg);color:var(--ok)}
.opt.ok .key{background:var(--ok);color:var(--surface)}
.opt.no{border-color:var(--no-border);background:var(--no-bg);color:var(--no)}
.opt.no .key{background:var(--no);color:var(--surface)}
.opt.dim{opacity:.5}
.fb{margin-top:16px;padding:16px 18px;border-radius:14px;border:1.5px solid;display:flex;flex-direction:column;gap:10px;font-size:16px}
.fb.ok{border-color:var(--ok-border);background:var(--surface)}
.fb.no{border-color:var(--no-border);background:var(--surface)}
.fb-head{font-weight:700;font-size:18px}
.fb.ok .fb-head{color:var(--ok)}
.fb.no .fb-head{color:var(--no)}
.fb .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.bubble{display:flex;align-items:flex-start;gap:10px;background:var(--accent-bg);color:var(--accent-text);padding:11px 14px;border-radius:12px 12px 12px 4px;font-size:15px}
.bubble span{flex:1}
.copy{flex:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:2px 9px;font-size:12px;cursor:pointer;opacity:.8}
.copy:hover{opacity:1}
.formel{background:var(--surface-2);padding:10px 14px;border-radius:10px;font-size:15px}
.tipp{background:var(--surface-2);padding:10px 14px;border-radius:10px;font-size:15px}
.next-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px}
.hint{font-size:13px;color:var(--muted)}
.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}

/* Ende */
.end{padding:28px 24px;text-align:center}
.end .big{font-size:52px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.end .big span{font-size:24px;color:var(--text-2);font-weight:600}
.end h1{font-size:24px;margin:8px 0 4px}
.end p{color:var(--text-2)}
.end-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.review{margin-top:22px}
.review ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.review .dot{margin-top:7px}
.rv-q{font-size:14px;color:var(--text-2)}
.rv-q code{overflow-wrap:anywhere}
.rv-a{font-weight:600;font-size:15px}

/* Mini-Oberflächen */
.mock{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--mock-bg);margin:14px 0 4px}
.mock-bar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.mock-bar i{width:9px;height:9px;border-radius:50%;background:var(--mock-line)}
.mock-body{position:relative;padding:16px;min-height:180px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.mock-body.flush{padding:0}
.hl{outline:3px solid var(--hl);outline-offset:4px;border-radius:8px;animation:hlpulse 1.1s ease-in-out 3}
.answered .hl{animation:none}
@keyframes hlpulse{50%{outline-color:transparent}}
.m-line{display:block;height:9px;border-radius:5px;background:var(--mock-line)}
.m-title{font-size:15px;font-weight:650}
.m-row{display:flex;align-items:center;gap:8px}
.m-row.between{justify-content:space-between;align-items:flex-start}
.m-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-size:13px;white-space:nowrap}
.m-btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.m-btn.primary.hovered{background:var(--accent-hover)}
.m-btn.danger{background:#d9434f;color:#fff;border-color:transparent}
.ico{width:18px;height:18px;flex:none}
.m-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
.m-toast{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:9px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500}
.m-overlay{position:absolute;inset:0;background:var(--mock-dark);display:flex;align-items:center;justify-content:center}
.m-overlay.hl{outline-offset:-5px;border-radius:0}
.m-dialog{background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;width:min(300px,78%);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px}
.m-dialog b{font-size:14px}
.m-dialog .m-row{justify-content:flex-end;margin-top:6px}
.m-dd-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding:2px}
.m-dd{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;min-width:160px;overflow:hidden}
.m-dd span{padding:6px 12px;font-size:13px}
.m-dd span.on{background:var(--accent-bg);color:var(--accent-text)}
.m-tip-wrap{position:relative;display:inline-flex}
.m-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;padding:4px 9px;border-radius:6px;white-space:nowrap}
.m-split{display:flex;min-height:196px}
.m-side{width:36%;background:var(--surface-2);padding:14px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.m-side span{padding:6px 10px;border-radius:6px}
.m-side span.on{background:var(--accent-bg);color:var(--accent-text);font-weight:600}
.m-side.hl{outline-offset:-5px;border-radius:0}
.m-main{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.m-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.m-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.m-tabs span{padding:8px 12px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.m-tabs span.on{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:650}
.m-acc{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.m-acc-item+.m-acc-item{border-top:1px solid var(--border)}
.m-acc-q{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:13px;font-weight:600}
.m-acc-a{padding:0 12px 10px;font-size:13px;color:var(--text-2)}
.m-setting{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.m-switch{width:40px;height:22px;border-radius:11px;background:var(--mock-line);position:relative;display:inline-block}
.m-switch i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.m-switch.on{background:var(--accent)}
.m-switch.on i{left:21px}
.m-switch.hl{border-radius:11px}
.m-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;background:var(--surface);flex:none}
.m-check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.m-radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);display:inline-block;position:relative;background:var(--surface);flex:none}
.m-radio.on{border-color:var(--accent)}
.m-radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.m-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.m-group{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:8px}
.m-group b{font-size:13px}
.m-opt{display:flex;align-items:center;gap:8px;font-size:13px}
.m-field{display:flex;flex-direction:column;gap:4px}
.m-label{font-size:12px;font-weight:600;color:var(--text-2)}
.m-input{display:flex;align-items:center;height:34px;padding:0 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-size:13px}
.m-ph{color:var(--muted)}
.m-ph.hl{outline-offset:3px;border-radius:4px}
.m-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px}
.m-badge{position:absolute;top:-2px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.m-badge.hl{border-radius:9px;outline-offset:3px}
.m-skel-wrap{display:flex;flex-direction:column;gap:10px}
.m-skel-card{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.m-skel-lines{flex:1;display:flex;flex-direction:column;gap:8px}
.m-skel{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--mock-line) 25%,var(--surface-2) 50%,var(--mock-line) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.m-skel.circle{width:40px;height:40px;border-radius:50%;flex:none}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.m-muted{color:var(--muted);font-size:12px}
.m-links{display:flex;gap:12px;font-size:13px;color:var(--text-2)}
.m-footer{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:10px 4px 2px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.m-footer a{color:var(--text-2);text-decoration:underline;text-underline-offset:2px}
.m-chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;padding:2px}
.m-chips span{padding:4px 12px;border-radius:999px;border:1px solid var(--border-strong);font-size:12px;background:var(--surface)}
.m-chips span.on{background:var(--accent-bg);color:var(--accent-text);border-color:transparent;font-weight:600}
.m-chips.hl{border-radius:16px}
.m-pages{display:flex;gap:4px;align-self:center;margin-top:auto;padding:2px}
.m-pages span{min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:13px}
.m-pages span.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.m-pages span.dots{border:none;background:none}
.m-slider{position:relative;display:inline-block;width:130px;height:6px;border-radius:3px;background:var(--mock-line)}
.m-slider i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.m-slider b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);transform:translate(-50%,-50%)}
.m-slider.hl{outline-offset:9px}
.m-spin-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:150px}
.m-spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--mock-line);border-top-color:var(--accent);animation:spin .9s linear infinite}
.m-spinner.hl{border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.m-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.m-list-row{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;font-size:13px}
.m-list-row+.m-list-row{border-top:1px solid var(--border)}
.m-list .m-icon-btn{width:30px;height:30px;border:none;background:none}
.m-btn.disabled{background:var(--mock-line);color:var(--muted);border-color:transparent}
.m-input.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.m-caret{display:inline-block;width:1px;height:16px;background:var(--text);margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.m-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px;border:1.5px dashed var(--border-strong);border-radius:10px;font-size:13px;color:var(--text-2)}
.m-empty .ico{width:30px;height:30px;color:var(--muted)}
.m-empty b{color:var(--text);font-size:14px}
.m-progress{display:block;height:8px;border-radius:4px;background:var(--mock-line);overflow:hidden}
.m-progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.m-progress.hl{border-radius:4px}
.m-crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;align-self:flex-start;padding:2px 6px}
.m-crumbs a{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.m-crumbs span{color:var(--text)}
.m-hover-demo{display:flex;gap:36px;justify-content:center;align-items:flex-start;margin-top:22px}
.m-hover-demo figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.m-hover-demo figcaption{font-size:12px;color:var(--muted)}
.m-hover-wrap{position:relative;display:inline-flex}
.m-cursor{position:absolute;right:-12px;bottom:-18px;width:22px;height:22px}

/* Startseite: Auswahl von Runde und Länge */
.top-r{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.hero{flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:16px}
.hero-wahl{display:flex;flex-direction:column;gap:10px}
.wahl-zeile{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.wahl-lbl{font-size:13px;color:var(--text-2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2)}
.seg-b{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:14px;color:var(--text-2);cursor:pointer}
.seg-b:hover{color:var(--text)}
.seg-b.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.hinweis{font-size:14px;color:var(--text-2);margin-top:12px}
.hero .hinweis{margin-top:6px}
.section-title.mt{margin-top:30px}
.foot-r{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.linkish.neutral:hover{color:var(--text)}
.btn[disabled]{opacity:.5;cursor:default}

/* Abzeichen und Konfetti */
.stats:has(+ .abz){margin-bottom:10px}
.abz{margin:0 0 30px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px}
.abz summary{cursor:pointer;padding:11px 0;font-size:14px;color:var(--text-2)}
.abz-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 10px;padding-bottom:14px}
.medaille{display:flex;align-items:center;gap:10px;opacity:.45}
.medaille.hat{opacity:1}
.abz-kreis{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-2);border:2px solid var(--border-strong)}
.medaille.hat .abz-kreis{background:var(--accent);color:var(--on-accent);border-color:transparent}
.abz-text{display:flex;flex-direction:column;font-size:12px;color:var(--text-2);line-height:1.3;min-width:0;text-align:left}
.abz-text b{font-size:13px;color:var(--text)}
.abz-neu{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.abz-neu .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.konfetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(540deg)}}

/* Rückblick auf die letzten Runden */
.rb{display:flex;flex-direction:column;gap:6px}
.rb details{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px}
.rb summary{cursor:pointer;padding:11px 0;font-size:14px;color:var(--text-2)}
.rb ul{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:10px}
.rb li{display:flex;gap:12px;align-items:flex-start}
.rb li .dot{margin-top:7px}
.rb-ok{font-size:14px;color:var(--text-2);padding-bottom:12px}

/* Kartenarten */
.key,.nr{font-variant-numeric:tabular-nums}
.kandidat{margin-top:16px;padding:13px 16px;border-radius:12px;border:1.5px dashed var(--border-strong);background:var(--surface)}
.kandidat .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.opts.zwei{flex-direction:row;margin-top:10px}
.opts.zwei .opt{flex:1;align-items:center}
.gap{display:inline-block;min-width:3.2em;text-align:center;padding:0 8px;border-radius:6px;border:1.5px dashed var(--hl);color:var(--hl)}
.gap.ok{border-style:solid;border-color:#5fbf73;color:#8ad197;background:rgba(95,191,115,.16)}
.chips-wahl,.vorrat{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:flex-start;gap:8px;padding:9px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:15px;text-align:left;line-height:1.35;transition:border-color .15s,background .15s}
.chip:hover:not([disabled]){border-color:var(--accent)}
.chip code{background:none;padding:0;font-size:14px}
.chip .key,.paar .key,.schritt .nr{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2)}
.chip.ok,.paar.ok,.schritt.ok{border-color:var(--ok-border);background:var(--ok-bg);color:var(--ok)}
.chip.no,.paar.no,.schritt.no{border-color:var(--no-border);background:var(--no-bg);color:var(--no)}
.chip.ok .key,.paar.ok .key,.schritt.ok .nr{background:var(--ok);color:var(--surface)}
.chip.no .key,.paar.no .key,.schritt.no .nr{background:var(--no);color:var(--surface)}
.chip.dim{opacity:.5}
.chip[disabled],.paar[disabled],.schritt[disabled]{cursor:default}
.opt.mf .box{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:13px;line-height:1;margin-top:1px;background:var(--surface)}
.opt.mf.an{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.opt.mf.an .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.mf.ok .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.mf.no .box{background:var(--no);border-color:var(--no);color:var(--surface)}
.opt.mf.fehlt{border-style:dashed;border-color:var(--ok-border);color:var(--ok)}
.pruef-row{display:flex;justify-content:flex-end;margin-top:14px}
.reihe{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding:10px;border-radius:14px;background:var(--surface-2);min-height:62px}
.schritt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;line-height:1.4;font-size:15px}
.schritt.leer{border-style:dashed;color:var(--muted);cursor:default;background:transparent}
.schritt .nr{background:var(--accent);color:var(--on-accent)}
.loesung{margin:0;padding-left:22px;font-size:15px;display:flex;flex-direction:column;gap:3px}
.code.zeilen{padding:8px;display:flex;flex-direction:column;gap:2px;white-space:normal}
.zl{display:flex;gap:12px;width:100%;text-align:left;background:transparent;border:1.5px solid transparent;border-radius:8px;padding:6px 8px;color:inherit;font:inherit;cursor:pointer}
.zl .tx{white-space:pre-wrap;word-break:break-word;min-width:0}
.zl .nr{color:var(--code-dim);user-select:none;min-width:1.2em;text-align:right;flex:none}
.zl:hover:not([disabled]){border-color:var(--code-dim)}
.zl.ok{border-color:#5fbf73;background:rgba(95,191,115,.16)}
.zl.no{border-color:#f08a80;background:rgba(240,138,128,.16)}
.zl[disabled]{cursor:default}
.paare{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;margin-top:16px}
.spalte{display:flex;flex-direction:column;gap:8px}
.paar{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;line-height:1.35;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.paar:hover:not([disabled]){border-color:var(--accent)}
.paar.an{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.paar.halb{border-style:dashed;border-color:var(--hl);color:var(--text-2)}
.paar.no{animation:wackel .3s}
@keyframes wackel{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Szenen fürs „Ins Bild tippen“ */
.teil{cursor:pointer}
.answered .teil{cursor:default}
.teil[role="button"]:hover,.teil[role="button"]:focus-visible{outline:2px dashed var(--border-strong);outline-offset:3px}
.teil.hl-ok{outline:3px solid var(--ok);outline-offset:3px}
.teil.hl-no{outline:3px solid var(--no);outline-offset:3px}
.m-overlay.teil,.m-side.teil{outline-offset:-5px !important;border-radius:0}
.m-badge.teil::after,.m-switch.teil::after,.m-slider.teil::after,.m-spinner.teil::after,.m-ph.teil::after,.m-tip.teil::after{content:"";position:absolute;inset:-9px}
.m-ph.teil,.m-spinner.teil{position:relative}
.sz .mock-body{min-height:0}
.sz .m-toast{position:static;align-self:flex-end}
.sz .m-spinner{width:22px;height:22px;flex:none}
.sz .m-groups{grid-template-columns:repeat(2,minmax(0,1fr))}
.sz-liste .m-side{width:30%;padding:12px 6px}
.sz-liste .m-main{padding:12px;min-width:0}
.sz-liste .m-pages{margin-top:4px}
.sz-dialog .mock-body{min-height:240px}
.sz-dialog .m-dialog{gap:12px}

@media (max-width:520px){
  .seg{width:100%}
  .seg-b{flex:1;padding:8px 6px}
  .wahl-zeile{flex-direction:column;align-items:stretch}
}

@media (max-width:520px){
  .frage{font-size:20px}
  .topic{grid-template-columns:auto minmax(0,1fr) 64px}
  .chev{display:none}
  .hero{padding:20px}
  .hero .btn{width:100%}
  .stat .num{font-size:20px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
